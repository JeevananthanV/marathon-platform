name: Marathon Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, "release/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Automated Testing & Linting
  backend-test:
    name: Backend Test Suite (89 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest -v --tb=short
        env:
          APP_ENV: test
          DEBUG: true
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          INTEGRATIONS_MOCK_MODE: true
          RAZORPAY_KEY_ID: rzp_test_placeholder_key
          RAZORPAY_KEY_SECRET: rzp_test_placeholder_secret
          RAZORPAY_WEBHOOK_SECRET: rzp_webhook_secret_123

  # 2. Frontend Validation & Production Bundle
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type-Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Vite Production Build
        run: |
          cd frontend
          npm run build

  # 3. Docker Containerization & Compose Validation
  docker-validation:
    name: Docker Build & Compose Config
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          docker compose config

      - name: Build Backend Image
        run: |
          docker build -t marathon-backend:ci ./backend

      - name: Build Frontend Image
        run: |
          docker build -t marathon-frontend:ci ./frontend
