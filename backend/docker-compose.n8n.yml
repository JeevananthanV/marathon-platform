version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: marathon_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - BACKEND_API_URL=http://host.docker.internal:8000
      - N8N_WEBHOOK_SECRET=marathon_n8n_secret_2026
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
